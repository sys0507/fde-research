name: Independent package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -B -X utf8 scripts/check_package.py
      - run: python -B -X utf8 scripts/run_tests.py --output "${{ runner.temp }}/fde-tests"
      - run: python -B -X utf8 validation/evidence/2.2.1-linux/verify_evidence.py
      - run: python -B -X utf8 scripts/release_package.py --output "${{ runner.temp }}/fde-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/fde-tests
            ${{ runner.temp }}/fde-release
          if-no-files-found: warn
