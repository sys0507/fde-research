name: Real LibreOffice smoke check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-dejavu-core fonts-noto-cjk
      - run: python -B -X utf8 scripts/smoke_word.py --soffice /usr/bin/soffice --output "${{ runner.temp }}/fde-word"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: word-pages-review-required
          path: ${{ runner.temp }}/fde-word
          if-no-files-found: warn
