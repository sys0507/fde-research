<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business scenario demo</title>
<style>
:root{--nav:#162b3e;--ink:#233748;--muted:#6e8294;--line:#dfe6ed;--accent:#176e68;--bg:#f3f6f8;--blue:#356fc5}*{box-sizing:border-box}body{margin:0;font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #4aa99a;outline-offset:3px}.demo-bar{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;gap:20px}.demo-bar strong{font-size:13px}.switcher{display:flex;background:#f0f3f6;padding:3px;border-radius:7px;gap:3px}.switcher button{border:0;background:none;color:#657b90;border-radius:5px;padding:5px 18px;font-size:12px}.switcher button.active{background:var(--nav);color:white}.app{min-height:calc(100vh - 52px);display:grid;grid-template-columns:218px minmax(0,1fr)}aside{background:var(--nav);color:#dce6ee;display:flex;flex-direction:column;padding:27px 18px 20px}.brand{display:flex;align-items:center;gap:12px;padding:0 8px 28px}.brandmark{height:36px;width:36px;border-radius:10px;background:#3e857f;color:white;display:grid;place-items:center;font-weight:750;font-size:18px}.brand strong{font-size:17px;letter-spacing:1px}.brand small{display:block;color:#90aaba;font-size:10px;letter-spacing:2px}.nav-title{color:#7792a8;padding:12px;font-size:10px;letter-spacing:2px}.nav-item{padding:12px 14px;color:#afc2d2;border-radius:7px;margin:3px 0;font-size:13px;display:flex;gap:12px;align-items:center}.nav-item.active{background:#2e495d;color:#fff;box-shadow:inset 3px 0 #7dc8b7}.nav-icon{font-size:16px;color:#8daabc;width:18px;text-align:center}.nav-item.active .nav-icon{color:#a9e6d6}.side-footer{margin-top:auto;border-top:1px solid #355064;padding:18px 9px 0;font-size:11px;color:#9fb5c6}.workspace{min-width:0;display:flex;flex-direction:column}.topbar{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 35px}.organization{font-weight:600;font-size:13px}.organization span{font-weight:400;color:var(--muted);margin-left:18px}.identity{display:flex;align-items:center;gap:10px;font-size:12px}.avatar{height:34px;width:34px;border-radius:50%;background:#e9f1f1;color:var(--accent);display:grid;place-items:center;font-weight:650}.identity small{display:block;color:var(--muted);font-size:10px}.content{padding:28px 36px;flex:1;min-width:0}.crumb{font-size:11px;color:#8a9baa;margin-bottom:12px}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:22px;margin-bottom:24px}.page-heading h1{font-size:25px;line-height:1.4;margin:0 0 7px;font-weight:650;letter-spacing:.2px}.subtitle{font-size:12px;color:var(--muted)}.primary{border:1px solid var(--accent);color:#fff;background:var(--accent);padding:10px 19px;border-radius:7px;box-shadow:0 3px 6px #126c6410;font-size:13px;white-space:nowrap}.primary.secondary{color:var(--accent);background:white;border-color:#b7d3cb;box-shadow:none}.context{display:flex;gap:20px;align-items:center;padding:15px 20px;background:white;border:1px solid var(--line);border-radius:9px;margin-bottom:22px;font-size:12px}.context b{border-right:1px solid var(--line);padding-right:20px;font-size:13px}.context span{flex:1;color:#61788c}.badge{font-size:11px;background:#eef5f3;color:#3e7e6e;border:1px solid #d5e8e0;border-radius:4px;padding:3px 9px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:10px;grid-column:span 6;min-width:0;box-shadow:0 3px 8px #14263703;overflow:hidden}.card.wide{grid-column:span 12}.card.narrow{grid-column:span 4}.card.main{grid-column:span 8}.card-head{padding:16px 21px;border-bottom:1px solid #edf1f4;display:flex;align-items:center;justify-content:space-between;gap:14px}.card-head h2{font-size:14px;margin:0;font-weight:600}.card-head small{font-size:10px;color:#8395a5}.card-body{padding:22px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:22px 28px}.field-label{font-size:11px;color:#7c91a3;margin-bottom:7px}.field-value{font-size:14px;line-height:1.8;overflow-wrap:anywhere}.field-value.emphasis{font-size:25px;font-weight:650;color:var(--accent);letter-spacing:.2px}.facts .full{grid-column:1/-1}.notice{background:#f6f9f8;border-left:3px solid #99c3b7;padding:14px 17px;font-size:12px;color:#547769;margin-top:20px}.document{font-size:13px;line-height:2;max-width:78ch}.document p{margin:0 0 15px}.document p:last-child{margin:0}.document .sheet-title{font-weight:600;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}.muted{color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px;text-align:left;table-layout:fixed}th{padding:12px 21px;background:#f7f9fb;color:#8092a1;font-weight:500}td{padding:14px 21px;border-top:1px solid #edf1f4;overflow-wrap:anywhere}tr:last-child td{border-bottom:0}.messages{display:flex;flex-direction:column;gap:16px}.msg-meta{display:flex;justify-content:space-between;font-size:10px;color:#8295a5;margin-bottom:7px}.bubble{background:#f2f5f8;border-radius:0 8px 8px 8px;padding:13px 16px;font-size:13px;line-height:1.85}.msg:nth-child(even) .bubble{background:#eaf4f0}.timeline{display:flex;flex-direction:column;gap:20px}.event{display:flex;gap:15px}.dot{width:9px;height:9px;border-radius:50%;background:#6da98e;box-shadow:0 0 0 4px #edf5f0;margin-top:7px;flex:none}.event.wait .dot{background:#cfa75e;box-shadow:0 0 0 4px #faf4e7}.event strong{font-size:13px;font-weight:600}.event p{margin:4px 0 0;font-size:12px;color:#8192a1}.app-footer{padding:14px 36px 20px;display:flex;justify-content:space-between;gap:20px;font-size:10px;color:#8b9ba7}.legacy{grid-template-columns:1fr}.legacy aside{display:none}.legacy .content{max-width:1390px;width:100%;margin:auto}.legacy .topbar{background:#f9fafb}.legacy .card-head{background:#f8f9fb}.legacy .context{background:#f8fafc}.legacy .workspace{background:#eff2f5}.legacy .primary{background:white;color:#526d84;border-color:#ced9e3;box-shadow:none}.legacy .badge{background:#f2f4f7;border-color:#dde3e9;color:#718597}.legacy .card{border-radius:7px}.legacy .brandmark{background:#778aa0}@media(max-width:800px){.app{grid-template-columns:1fr}aside{display:none}.content{padding:22px 16px}.topbar{padding:0 18px}.organization span{display:none}.demo-bar{height:auto;min-height:52px;flex-wrap:wrap;padding:10px 16px}.switcher button{padding:5px 12px}.page-heading{align-items:flex-start;flex-direction:column}.context{flex-wrap:wrap;gap:9px}.context span{flex-basis:65%}.card,.card.main,.card.narrow{grid-column:span 12}.facts{gap:18px}.app-footer{padding:14px 16px}.demo-bar strong{font-size:11px}}@media print{.demo-bar{display:none}.app{min-height:0}aside{display:none}.app{grid-template-columns:1fr}.card{break-inside:avoid}}
</style></head><body>
<div class="demo-bar"><strong id="demo-title"></strong><div class="switcher" aria-label="Simulation phase"><button data-phase="before">Before</button><button data-phase="after">After</button><button data-phase="result">Action result</button></div></div>
<div id="app" class="app" data-capture-root><aside><div class="brand"><span class="brandmark" id="brandmark"></span><div><strong id="product"></strong><small>WORKSPACE</small></div></div><div class="nav-title">Business workspace</div><nav id="navigation"></nav><div class="side-footer" id="side-footer"></div></aside><div class="workspace"><header class="topbar"><div class="organization"><b id="organization"></b><span id="module"></span></div><div class="identity"><span class="avatar" id="avatar"></span><div><strong id="person"></strong><small id="role"></small></div></div></header><main class="content"><div class="crumb" id="crumb"></div><div class="page-heading"><div><h1 id="title"></h1><div class="subtitle" id="subtitle"></div></div><button class="primary" data-primary></button></div><div class="context"><b id="object"></b><span id="task"></span><small class="badge" id="state-label"></small></div><div class="grid" id="blocks"></div></main><footer class="app-footer"><span id="footnote"></span><span id="simulation-label"></span></footer></div></div>
<script>
const scene=__SCENE_DATA__;
const labels={before:'Before',after:'After',result:'Action result'};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const set=(id,value)=>document.getElementById(id).textContent=value||'';
function block(b){let inner='';
if(b.type==='facts')inner='<div class="card-body"><div class="facts">'+b.items.map(i=>'<div class="'+(i.full?'full':'')+'"><div class="field-label">'+esc(i.label)+'</div><div class="field-value '+(i.emphasis?'emphasis':'')+'">'+esc(i.value)+'</div></div>').join('')+'</div>'+(b.note?'<div class="notice">'+esc(b.note)+'</div>':'')+'</div>';
if(b.type==='table')inner='<table><thead><tr>'+b.columns.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
if(b.type==='document'||b.type==='text')inner='<div class="card-body document">'+b.paragraphs.map(p=>'<p>'+esc(p)+'</p>').join('')+'</div>';
if(b.type==='messages')inner='<div class="card-body messages">'+b.items.map(i=>'<div class="msg"><div class="msg-meta"><span>'+esc(i.from)+'</span><span>'+esc(i.time||'')+'</span></div><div class="bubble">'+esc(i.text)+'</div></div>').join('')+'</div>';
if(b.type==='timeline')inner='<div class="card-body timeline">'+b.items.map(i=>'<div class="event '+(i.state==='wait'?'wait':'')+'"><span class="dot"></span><div><strong>'+esc(i.title)+'</strong><p>'+esc(i.text)+'</p></div></div>').join('')+'</div>';
return '<section class="card '+esc(b.width||'')+'"><header class="card-head"><h2>'+esc(b.title)+'</h2><small>'+esc(b.tag||'')+'</small></header>'+inner+'</section>'}
function show(phase){if(!scene.states[phase])phase='after';const s=scene.states[phase];document.body.dataset.state=phase;document.getElementById('app').classList.toggle('legacy',phase==='before');document.title=scene.title+' · '+labels[phase];set('demo-title',scene.id+' · '+scene.title+' · Scenario interface demo');set('product',scene.product);set('brandmark',scene.product.slice(0,1));set('organization',scene.organization);set('module',s.module||scene.module);set('person',scene.person);set('avatar',scene.person.slice(-1));set('role',scene.role);set('side-footer',scene.organization+'\n'+scene.time);set('crumb',s.crumb||scene.module+' / '+scene.object);set('title',s.title);set('subtitle',s.subtitle);set('object',scene.object);set('task',scene.task);set('state-label',phase==='before'?'Reconstructed original workflow':'Proposed business capability');set('footnote',scene.basis);set('simulation-label',scene.simulation_label||'Simulation · Not a production system');
 document.getElementById('navigation').innerHTML=scene.navigation.map((n,i)=>'<div class="nav-item '+(i===0?'active':'')+'"><span class="nav-icon">'+['▦','☷','◇','◷','▤'][i%5]+'</span>'+esc(n)+'</div>').join('');
 document.getElementById('blocks').innerHTML=s.blocks.map(block).join('');
 const action=document.querySelector('[data-primary]');action.textContent=s.action?.label||'';action.hidden=!s.action;action.classList.toggle('secondary',phase==='result');action.onclick=()=>{if(s.action)navigate(s.action.target)};
 document.querySelectorAll('[data-phase]').forEach(b=>{b.hidden=!scene.states[b.dataset.phase];b.classList.toggle('active',b.dataset.phase===phase)});
}
function navigate(phase){const u=new URL(location.href);u.searchParams.set('state',phase);history.replaceState(null,'',u);show(phase)}
document.querySelectorAll('[data-phase]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.phase)));
show(new URL(location.href).searchParams.get('state')||'after');
</script></body></html>
